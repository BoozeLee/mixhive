name: Feature request
description: Suggest a new capability or enhancement
title: "[feat] "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user pain or use case, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - auth
        - feed
        - player
        - upload
        - mix detail
        - profile
        - notifications
        - playlists
        - search
        - database / RLS
        - other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context, mockups, references
