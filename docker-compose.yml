version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=http://supabase:54321
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=dev-anon-key
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/mixhive_dev
    depends_on:
      - supabase
      - redis
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  # Supabase Database
  supabase:
    image: supabase/postgres:15.1
    ports:
      - '54321:54321'
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - DB_PORT=54321
    volumes:
      - supabase_data:/var/lib/postgresql/data

  # PostgreSQL (alternative to Supabase)
  postgres:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=mixhive_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # Redis Cluster (for production)
  redis-cluster:
    image: redis:7-alpine
    ports:
      - '16379:16379'
      - '16380:16380'
    command: redis-server --cluster-enabled yes --cluster-config-file nodes-16379.conf --cluster-node-timeout 5000 --appendonly yes --appendfilename appendonly-16379.db --dbfilename dump-16379.rdb --port 16379
    volumes:
      - redis_cluster_data:/data

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
      - supabase

  # MinIO for S3-compatible storage (alternative to CDN)
  minio:
    image: minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # PostgreSQL Admin UI
  adminer:
    image: adminer
    ports:
      - '8080:8080'
    environment:
      - ADMINER_DEFAULT_SERVER=postgres

  # Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - '8081:8081'
    environment:
      - REDIS_HOSTS=local:redis:6379

volumes:
  supabase_data:
  postgres_data:
  redis_data:
  redis_cluster_data:
  minio_data:
