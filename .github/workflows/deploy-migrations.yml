name: Deploy migrations to production

# ⚠️ DO NOT RUN AS WRITTEN — see the safety note below.
#
# Verified against production on 2026-07-20 via the Management API:
# supabase_migrations.schema_migrations DOES NOT EXIST on the linked project.
# There is no migration ledger; the schema was assembled by other means.
#
# `db push --include-all` means "apply everything absent from the remote history
# table". With no history table that is ALL 113 migrations, replayed against a
# database that already holds 112 tables. Not all of them are idempotent, so this
# would be destructive.
#
# The earlier "lying ledger" guard in this file anticipated the wrong failure: it
# assumed the ledger might falsely claim migrations were applied. In fact there is
# no ledger to lie.
#
# Before this workflow can be used, one of:
#   a) bootstrap supabase_migrations.schema_migrations to reflect what is really
#      deployed, then push only what is genuinely pending; or
#   b) apply the explicit missing set (102, 106, 108-115; NOT 116) directly, each
#      inside BEGIN/ROLLBACK first to prove it applies cleanly. Direct Postgres is
#      firewalled from the dev machine, but the Management API endpoint
#      /v1/projects/{ref}/database/query runs SQL over HTTPS and works.
#
# Until then the job below hard-stops.

# Applies pending migrations to the linked Supabase project.
#
# Why this exists: nothing applied migrations to production. schema-drift.yml
# only *detects* drift and is gated off behind a repo variable, so schema changes
# were applied by hand, out of order, and sometimes recorded without running --
# 071's own header notes that 004 and 023 were marked applied via
# `repair --status applied` without executing. As of 2026-07-20 production is
# behind by 9 tables and 11 columns.
#
# Deliberately manual (workflow_dispatch only). Schema changes should never ride
# along with a code deploy, and dry_run defaults to true so the first run of any
# change reports rather than acts.
#
# Requires three repository secrets:
#   SUPABASE_ACCESS_TOKEN  — personal access token (Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   — database password (Project Settings → Database)
#   SUPABASE_PROJECT_REF   — project ref, e.g. the value in supabase/.temp/project-ref

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be applied without applying it'
        type: boolean
        default: true
      exclude:
        description: 'Space-separated migration version prefixes to hold back'
        type: string
        # 116 adds the required_tier paywall column. MASTER_ROADMAP gates
        # monetization to the P14 pre-launch quality gate, so it is held back by
        # default and must be released deliberately.
        default: '116'

permissions:
  contents: read

jobs:
  deploy:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Refuse to run until the ledger question is settled
        run: |
          echo "::error::Production has no supabase_migrations.schema_migrations table."
          echo "::error::'db push --include-all' would replay all 113 migrations against a populated database."
          echo "::error::See the safety note at the top of this workflow. Remove this step only once the ledger is bootstrapped."
          exit 1

      - uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Verify required secrets are present
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=
          [ -n "$TOKEN" ]       || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Hold back excluded migrations
        env:
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          mkdir -p /tmp/held-back
          for v in $EXCLUDE; do
            # Validate before it reaches a path: digits only, so the value cannot
            # traverse directories or glob outside supabase/migrations.
            case "$v" in
              '') continue ;;
              *[!0-9]*)
                echo "::error::Invalid migration version '$v' — digits only."
                exit 1 ;;
            esac
            for f in supabase/migrations/"$v"_*.sql; do
              [ -e "$f" ] || continue
              echo "holding back $(basename "$f")"
              mv "$f" /tmp/held-back/
            done
          done
          echo "remaining migrations: $(ls supabase/migrations/*.sql | wc -l)"

      - name: Link to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show remote ledger and what would be pushed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "::group::Remote migration ledger"
          supabase migration list --linked
          echo "::endgroup::"
          echo "::group::What db push would apply"
          supabase db push --linked --include-all --dry-run
          echo "::endgroup::"

      - name: Warn if an expected migration is already recorded as applied
        # db push decides purely from the remote history table. This project has
        # falsified that table before: 071's header records 004 and 023 being
        # marked applied via `repair --status applied` without their SQL running.
        # If any of these are recorded-but-not-run, push will skip them and this
        # job would report success while changing nothing — the exact failure we
        # are trying to end. Surface it loudly instead.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Versions known (2026-07-20) to be missing from production by schema
          # introspection, regardless of what the ledger claims.
          EXPECTED="102 106 108 109 110 111 112 113 114 115"
          list=$(supabase migration list --linked 2>/dev/null || true)
          suspect=
          for v in $EXPECTED; do
            # A row showing the version on both local and remote sides means the
            # ledger already claims it is applied.
            if echo "$list" | grep -E "^\s*\|?\s*$v\b" | grep -qE "$v.*$v"; then
              suspect="$suspect $v"
            fi
          done
          if [ -n "$suspect" ]; then
            echo "::warning::Ledger already claims these are applied, yet schema introspection said they are missing:$suspect"
            echo "::warning::db push will SKIP them. Reconcile first with: supabase migration repair --status reverted <version>"
          else
            echo "No conflict between the ledger and the known-missing set."
          fi

      - name: Apply
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # --include-all is required, not incidental: production applied 103-105
        # but not 102, so a plain push would skip the older pending migration.
        run: supabase db push --linked --include-all

      - name: Dry run notice
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::notice::Dry run — nothing was applied. Read the 'What db push would apply' group above: if it is empty, the ledger already claims these migrations are applied and a real run would change nothing."

      - name: Confirm post-state and that the expected versions landed
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase migration list --linked
          remaining=$(supabase db push --linked --include-all --dry-run 2>&1 || true)
          if echo "$remaining" | grep -qE "^\s*[0-9]{3}_"; then
            echo "::error::Migrations are still pending after the push:"
            echo "$remaining"
            exit 1
          fi
          echo "Nothing pending after push."

      - name: Restore held-back migrations
        if: always()
        run: |
          if ls /tmp/held-back/*.sql >/dev/null 2>&1; then
            mv /tmp/held-back/*.sql supabase/migrations/
            echo "restored held-back migrations to the working tree"
          fi
