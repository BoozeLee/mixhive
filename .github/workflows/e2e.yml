name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Real credentials when configured; otherwise the local Supabase stack
      # started below fills them in. The previous fallback was
      # https://placeholder.supabase.co, which meant every data-touching test
      # ran against a backend that does not exist — they failed on every PR and
      # the suite had stopped carrying information.
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase and apply the migration chain
        # Viable because the chain now applies from a clean checkout; see
        # migrations.yml, which guards exactly that property.
        run: supabase start

      - name: Export Supabase connection for build and tests
        # Prefer real secrets if the repo has them; fall back to the local stack
        # rather than to a placeholder host.
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${E2E_URL:-http://127.0.0.1:54321}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${E2E_ANON:-$ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
        env:
          E2E_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_ANON: ${{ secrets.E2E_SUPABASE_ANON_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build checked-out application
        run: npm run build

      - name: Start application server
        run: |
          npm run start -- -p 3099 &
          echo "Waiting for server on port 3099..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3099 > /dev/null 2>&1; then
              echo "Server is ready."
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3099 > /dev/null || { echo "Server failed to start"; exit 1; }

      - name: Run E2E tests against local server
        run: npx playwright test --project='Desktop Chrome' --project='Mobile Chrome'

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: e2e-results/
          retention-days: 7
