version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: chore
      include: scope
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - "@types/react"
          - "@types/react-dom"
      build-tooling:
        patterns:
          - vite
          - "@vitejs/*"
          - typescript
          - "@types/node"
      lint:
        patterns:
          - eslint
          - "@eslint/*"
          - eslint-*
          - typescript-eslint
          - globals
      supabase:
        patterns:
          - "@supabase/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
      - automated
    commit-message:
      prefix: ci
