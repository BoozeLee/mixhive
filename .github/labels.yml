# Source of truth for repository labels.
# Sync with: gh label create / edit (see scripts/sync-labels.sh)

# Type
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: task
  color: 0e8a16
  description: Internal implementation work
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: refactor
  color: c5def5
  description: Code restructure with no behaviour change
- name: performance
  color: fbca04
  description: Performance improvement

# Status
- name: needs-triage
  color: ededed
  description: Awaiting initial review
- name: blocked
  color: b60205
  description: Blocked on external dependency or decision
- name: in-progress
  color: 1d76db
  description: Someone is actively working on this
- name: ready-for-review
  color: 0e8a16
  description: PR or issue ready for review
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists

# Priority
- name: priority:critical
  color: b60205
  description: Drop everything
- name: priority:high
  color: d93f0b
  description: Important, should be next
- name: priority:medium
  color: fbca04
  description: Normal
- name: priority:low
  color: c2e0c6
  description: Nice to have

