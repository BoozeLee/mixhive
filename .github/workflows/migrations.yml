name: Migrations apply

# Guards the property that the migration chain can build a database from
# nothing. It could not, for a long time: `supabase start` failed on the very
# first migration, so no dev or CI environment could exist and no migration
# could be tested before it reached production. Seven never-executed defects had
# accumulated behind that failure.
#
# Unlike schema-drift.yml this needs no secrets and no linked project, so it
# cannot silently skip — it runs the real chain against a throwaway local
# Postgres on every PR that touches migrations.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-chain:
    name: Chain applies from a clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Reject duplicate migration version prefixes
        # schema_migrations keys on the leading number, so two files sharing a
        # prefix abort the chain with a primary-key violation. This has happened
        # twice (001 and 040) and is cheap to catch before spending a DB start.
        run: |
          dupes=$(ls supabase/migrations/*.sql \
            | xargs -n1 basename \
            | sed 's/_.*//' \
            | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration version prefixes: $dupes"
            for v in $dupes; do ls supabase/migrations/${v}_*.sql; done
            exit 1
          fi
          echo "No duplicate prefixes."

      - name: Start Supabase and apply every migration
        run: supabase start

      - name: Confirm the chain actually ran
        # `supabase start` can succeed with zero migrations applied if the
        # directory is empty or misnamed, so assert the count rather than trust
        # the exit code.
        #
        # Counted from the database, not from `supabase migration list` — that
        # command's table formatting does not parse reliably and produced a
        # false failure (reported 0 while the chain had in fact applied).
        run: |
          db=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          if [ -z "$db" ]; then
            echo "::error::No supabase_db container found; the stack did not start."
            exit 1
          fi
          applied=$(docker exec "$db" psql -U postgres -d postgres -tAc \
            'select count(*) from supabase_migrations.schema_migrations' | tr -d '[:space:]')
          files=$(ls supabase/migrations/*.sql | wc -l)
          echo "Applied: $applied   Files on disk: $files"
          if [ "${applied:-0}" -ne "$files" ]; then
            echo "::error::Expected $files migrations applied, got $applied."
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
