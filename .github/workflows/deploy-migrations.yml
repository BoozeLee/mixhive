name: Deploy migrations to production

# Applies pending migrations to the linked Supabase project.
#
# History, because it explains the guards below. Production had NO
# supabase_migrations.schema_migrations at all — the schema was assembled outside
# the migration system. `db push --include-all` therefore meant "replay all 111
# migrations against a populated database", so this workflow was hard-stopped.
#
# The ledger was bootstrapped on 2026-07-21 after a deep diff (tables, columns,
# functions, policies, triggers, indexes) confirmed production matched the chain.
# That diff found three migrations — 096, 101, 107 — that a tables-and-columns
# comparison had missed, because they create only functions, a policy and an
# index. They were applied first.
#
# 110 versions (000-115) are recorded. 116 is deliberately NOT, because it is
# genuinely not deployed.
#
# `--include-all` is gone: with a truthful ledger a plain push applies exactly
# what is pending, and --include-all would defeat the point of having one.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be applied without applying it'
        type: boolean
        default: true
      exclude:
        description: 'Space-separated migration version prefixes to hold back'
        type: string
        # 116 adds the required_tier paywall column. MASTER_ROADMAP gates
        # monetization to the P14 pre-launch quality gate, so it is held back by
        # default and must be released deliberately.
        default: '116'

permissions:
  contents: read

jobs:
  deploy:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify required secrets are present
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=
          [ -n "$TOKEN" ]       || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Hold back excluded migrations
        env:
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          mkdir -p /tmp/held-back
          for v in $EXCLUDE; do
            # Validate before it reaches a path: digits only, so the value cannot
            # traverse directories or glob outside supabase/migrations.
            case "$v" in
              '') continue ;;
              *[!0-9]*)
                echo "::error::Invalid migration version '$v' — digits only."
                exit 1 ;;
            esac
            for f in supabase/migrations/"$v"_*.sql; do
              [ -e "$f" ] || continue
              echo "holding back $(basename "$f")"
              mv "$f" /tmp/held-back/
            done
          done
          echo "remaining migrations: $(ls supabase/migrations/*.sql | wc -l)"

      - name: Link to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show remote ledger and what would be pushed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "::group::Remote migration ledger"
          supabase migration list --linked
          echo "::endgroup::"
          echo "::group::What db push would apply"
          supabase db push --linked --dry-run
          echo "::endgroup::"

      - name: Refuse to push if the remote has no migration ledger
        # The dangerous state is an ABSENT ledger, not a lying one. Production
        # had no supabase_migrations.schema_migrations at all until 2026-07-21;
        # with no ledger every migration reads as pending and a push replays the
        # entire chain against a populated database.
        #
        # The previous version of this step warned when specific versions looked
        # already-applied. That premise is now inverted — they ARE applied and
        # recorded — so it would have warned on every single run and taught
        # everyone to ignore it.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          list=$(supabase migration list --linked 2>&1 || true)
          echo "$list"
          recorded=$(echo "$list" | grep -cE "^[[:space:]]*\|?[[:space:]]*[0-9]{3}[[:space:]]*\|[[:space:]]*[0-9]{3}" || true)
          if [ "${recorded:-0}" -lt 50 ]; then
            echo "::error::Remote ledger looks absent or near-empty ($recorded rows matched)."
            echo "::error::A push in this state would replay the whole chain. Bootstrap the ledger first."
            exit 1
          fi
          echo "Remote ledger present ($recorded versions recorded)."

      - name: Apply
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      - name: Dry run notice
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::notice::Dry run — nothing was applied. Read the 'What db push would apply' group above: if it is empty, the ledger already claims these migrations are applied and a real run would change nothing."

      - name: Confirm post-state and that the expected versions landed
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase migration list --linked
          remaining=$(supabase db push --linked --dry-run 2>&1 || true)
          if echo "$remaining" | grep -qE "^\s*[0-9]{3}_"; then
            echo "::error::Migrations are still pending after the push:"
            echo "$remaining"
            exit 1
          fi
          echo "Nothing pending after push."

      - name: Restore held-back migrations
        if: always()
        run: |
          if ls /tmp/held-back/*.sql >/dev/null 2>&1; then
            mv /tmp/held-back/*.sql supabase/migrations/
            echo "restored held-back migrations to the working tree"
          fi
