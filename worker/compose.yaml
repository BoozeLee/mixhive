# MixHive self-hosted Active Worker Tier — Podman / Docker compatible.
#
#   podman compose -f worker/compose.yaml up -d --build
#
# Hosts the always-on jobs Vercel serverless can't run. P1 ships the audio worker
# + Redis; the Lua runtime and scheduler slot in here later (see INFRA_INTEGRATION_REPORT.md).

services:
  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--save',
        '60',
        '1',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    # No host port binding — Redis is only reachable inside the compose network.
    # This avoids conflicts with any Redis already running on the host.

  audio-worker:
    build:
      context: ./audio
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUDIO_BUCKET: ${AUDIO_BUCKET:-mix-audio}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-3}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-300000}
      WAVEFORM_POINTS: ${WAVEFORM_POINTS:-200}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-https://mixhive.vercel.app}
      CRON_SECRET: ${CRON_SECRET}
      IV_PUSH: ${IV_PUSH:-300}
    depends_on:
      - audio-worker

  # Creator-stage WebRTC relay. Public audiences never receive talkback audio;
  # TURN only improves connectivity for the six-person private creator mesh.
  coturn:
    image: docker.io/coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --realm=${TURN_REALM:-mixhive.app}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --cert=/etc/letsencrypt/live/turn.mixhive.app/fullchain.pem
      - --pkey=/etc/letsencrypt/live/turn.mixhive.app/privkey.pem
      - --no-multicast-peers
      - --stale-nonce=600
      - --user-quota=12
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --min-port=49160
      - --max-port=49200
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    profiles: ['rituals']
