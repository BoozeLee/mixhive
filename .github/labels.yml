# Automation
- name: dependencies
  color: 0366d6
  description: Pull requests that update a dependency
- name: automated
  color: ededed
  description: Opened by an automated process
- name: ci
  color: 0366d6
  description: Continuous integration
- name: security
  color: b60205
  description: Security-related

# Good first issue / community
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: 008672
