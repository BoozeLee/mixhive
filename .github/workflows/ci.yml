name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Type checking and linting
  type-check-and-lint:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    outputs:
      maintenance_only: ${{ steps.changes.outputs.maintenance_only }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect maintenance-only changes
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "$changed"
          non_maintenance="$(printf '%s\n' "$changed" | grep -Ev '^(README\.md|LICENSE|NOTICE|SECURITY\.md|CONTRIBUTING\.md|CODE_OF_CONDUCT\.md|docs/|\.github/(workflows/(ci|lighthouse)\.yml|dependabot\.yml|CODEOWNERS|PULL_REQUEST_TEMPLATE\.md|ISSUE_TEMPLATE/|copilot-instructions\.md))' || true)"
          if [ -z "$non_maintenance" ]; then
            echo "maintenance_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "maintenance_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip heavy checks for maintenance-only PR
        if: github.event_name == 'pull_request' && steps.changes.outputs.maintenance_only == 'true'
        run: echo "Maintenance-only PR; skipping type, lint, and repository-wide formatting checks."

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || steps.changes.outputs.maintenance_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.maintenance_only != 'true'
        run: npm ci

      - name: Run TypeScript check
        if: github.event_name != 'pull_request' || steps.changes.outputs.maintenance_only != 'true'
        run: npm run type-check

      - name: Run ESLint
        if: github.event_name != 'pull_request' || steps.changes.outputs.maintenance_only != 'true'
        run: npm run lint

      - name: Check formatting with Prettier
        if: github.event_name != 'pull_request' || steps.changes.outputs.maintenance_only != 'true'
        run: npm run format:check

  # Build and test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: type-check-and-lint
    outputs:
      maintenance_only: ${{ needs.type-check-and-lint.outputs.maintenance_only }}

    steps:
      - name: Skip build and test for maintenance-only PR
        if: github.event_name == 'pull_request' && needs.type-check-and-lint.outputs.maintenance_only == 'true'
        run: echo "Maintenance-only PR; skipping build and test."

      - name: Checkout code
        if: github.event_name != 'pull_request' || needs.type-check-and-lint.outputs.maintenance_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || needs.type-check-and-lint.outputs.maintenance_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name != 'pull_request' || needs.type-check-and-lint.outputs.maintenance_only != 'true'
        run: npm ci

      - name: Run tests
        if: github.event_name != 'pull_request' || needs.type-check-and-lint.outputs.maintenance_only != 'true'
        run: npm run test

      - name: Build application
        if: github.event_name != 'pull_request' || needs.type-check-and-lint.outputs.maintenance_only != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      - name: Check build output
        if: github.event_name != 'pull_request' || needs.type-check-and-lint.outputs.maintenance_only != 'true'
        run: |
          if [ ! -d ".next" ]; then
            echo "Build output missing!"
            exit 1
          fi

      - name: Analyze build size
        if: github.ref == 'refs/heads/main'
        run: npm run analyze

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request' || needs.build-and-test.outputs.maintenance_only != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: test

  # Docker build and push (optional)
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Vercel
  deploy-to-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Deploy preview to Vercel
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request' && needs.build-and-test.outputs.maintenance_only != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy Preview to Vercel
        run: vercel --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
